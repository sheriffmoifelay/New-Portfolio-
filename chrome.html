    <style>

        body{
            text-align: center;
        }

        #chrome{
            width: 150px;

            bottom: 260px;
            left: 350px;

        }

            flex-wrap: wrap;
            font-size: 25px;

        }

        #myOptions li a img{

            border-radius: 100%;

            margin-top: 20px;
        }

        .sub-main b{

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            color: white;
            position: relative;
            top: 20px;
        }

        .circle img{
            width: 100%;
            height: 100%;

            height: 50px;

            }

            .main{
                overflow-y: scroll;
                width: 90%;
                height: 50vh;
            }

            #menu{
                display: none;
